<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Etapa 1 - Del problema a los datos. Bitacora tecnica del proyecto de Mineria de Datos sobre incendios forestales.">
  <title>{% block title %}Etapa 1{% endblock %} · {{ project_name }}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ember: { 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' },
            ash:   { 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
</head>
<body class="min-h-screen bg-ash-950 font-sans text-slate-200 antialiased selection:bg-ember-500/30">

  <!-- ===================== HEADER ===================== -->
  <header class="sticky top-0 z-40 border-b border-white/5 bg-ash-950/80 backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">
      <a href="{{ url_for('main.index') }}" class="flex items-center gap-3">
        <span class="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-ember-500 to-red-600 shadow-lg shadow-ember-600/30">
          <svg class="h-6 w-6 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2s4.5 4.2 4.5 8.2A4.5 4.5 0 0 1 12 15a4.5 4.5 0 0 1-4.5-4.8C7.5 6.2 12 2 12 2Zm0 20c-3.9 0-7-2.6-7-6 0 0 1.6 1.6 3.1 1.6 0 0-1-3.4 1.4-6.3 0 2.4 1.6 3.4 2.5 4.3 1.2 1.2 1.5 2.6 1.1 4.1 1.4-.3 2.6-1.6 2.9-3.2 1 1.1 1.5 2.4 1.5 3.5 0 3.4-3.1 6-6.5 6Z"/>
          </svg>
        </span>
        <span class="leading-tight">
          <span class="block text-base font-extrabold tracking-tight text-white sm:text-lg">{{ project_name }}</span>
          <span class="hidden text-xs text-slate-400 sm:block">{{ project_tagline }}</span>
        </span>
      </a>

      <!-- Menu principal: Etapa 1 -->
      <nav class="flex items-center gap-1" aria-label="Etapas del proyecto">
        <a href="{{ url_for('etapa1.problema') }}"
           class="rounded-lg bg-ember-600/15 px-3 py-2 text-sm font-semibold text-ember-400 ring-1 ring-inset ring-ember-500/30">
          Etapa 1
        </a>
      </nav>
    </div>

    <!-- Submenu obligatorio de la Etapa 1 -->
    <div class="border-t border-white/5 bg-ash-900/40">
      <div class="mx-auto max-w-7xl overflow-x-auto px-4 sm:px-6 lg:px-8">
        <nav class="flex min-w-max gap-1 py-2" aria-label="Submenu Etapa 1">
          {% for item in submenu %}
          <a href="{{ url_for('etapa1.' + item.slug) }}"
             class="whitespace-nowrap rounded-lg px-3 py-1.5 text-xs font-medium transition
                    {{ 'bg-ember-600 text-white shadow' if item.slug == active_slug else 'text-slate-400 hover:bg-white/5 hover:text-white' }}">
            {{ item.label }}
          </a>
          {% endfor %}
        </nav>
      </div>
    </div>
  </header>

  <!-- ===================== CONTENIDO ===================== -->
  <main class="mx-auto max-w-5xl px-4 py-10 sm:px-6 lg:px-8">
    {% block content %}{% endblock %}
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="mt-12 border-t border-white/5 bg-ash-950">
    <div class="mx-auto max-w-7xl px-4 py-8 text-center sm:px-6 lg:px-8">
      <p class="text-xs text-slate-500">
        {{ project_name }} · Etapa 1 - Del problema a los datos · Proyecto academico de Mineria de Datos
      </p>
    </div>
  </footer>
</body>
</html>
